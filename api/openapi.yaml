openapi: 3.0.3
info:
  title: Sensor API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8000
paths:
  /api/v1/sensor_data:
    get:
      summary: Latest readings from all configured sensors
      operationId: getSensorData
      responses:
        "200":
          description: Latest sensor readings bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensorBundle"
        "503":
          description: No reading available yet (sensor not ready or failing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    SensorReading:
      type: object
      required: [id, bus_num, address, temperature_c, humidity_pct]
      properties:
        id:
          type: string
          example: sensor_1
        bus_num:
          type: integer
          example: 1
        address:
          type: string
          example: "0x44"
        temperature_c:
          type: number
          format: float
          example: 22.4
        humidity_pct:
          type: number
          format: float
          example: 48.1
    SensorBundle:
      type: object
      required: [sensors, timestamp]
      properties:
        sensors:
          type: array
          items:
            $ref: "#/components/schemas/SensorReading"
        timestamp:
          type: string
          format: date-time
          example: "2026-10-29T14:03:12Z"
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          example: No reading available yet
