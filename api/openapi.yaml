openapi: 3.0.3
info:
  title: Sensor API
  version: 1.0.0
servers:
  - url: http://raspberrypi.local:8000
paths:
  /api/v1/sensor_data:
    get:
      summary: Latest temperature and humidity reading
      operationId: getSensorData
      responses:
        "200":
          description: Latest reading
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensorData"
        "503":
          description: No reading available yet (sensor not ready or failing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    SensorData:
      type: object
      required: [temperature_c, humidity_pct, timestamp]
      properties:
        temperature_c:
          type: number
          format: float
          example: 22.4
        humidity_pct:
          type: number
          format: float
          example: 48.1
        timestamp:
          type: string
          format: date-time
          example: "2026-10-29T14:03:12Z"
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          example: No reading available yet
